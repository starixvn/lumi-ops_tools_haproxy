.reload-config:
  stage: reload_config
  script:
    - echo ${PROXY_SSH_COMMAND}
    - >
      for NODE in $SWARM_NODES;
      do
        if [ $NODE == 10.2.189.65 ]; 
        then
          export NODE_PORT=$KBT_PROXY_SSH_PORT;
        else
          export NODE_PORT=22;
        fi
        export COMMAND="${PROXY_SSH_COMMAND} ssh -p $NODE_PORT $SERVER_USER@$NODE 'docker kill --signal USR2 \$(docker container ls --filter name=haproxy-service --quiet) || true';"
        echo $COMMAND;
        $COMMAND;
        echo "Reload done for $NODE:$NODE_PORT";
      done
  tags:
    - docker
