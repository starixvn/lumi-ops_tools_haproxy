.create-haproxy-service:
  stage: create
  script:
    - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP
      docker network create -d overlay $DOCKER_NETWORK_NAME || true
    - export COMMAND="ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP
      docker service create
      --mode replicated
      --replicas 2
      --name haproxy-service
      --network $DOCKER_NETWORK_NAME
      --mount type=bind,source=/var/www/haproxy/,target=/usr/local/etc/haproxy/,ro=true
      --dns=127.0.0.11"
    - >
      for PORT in $PUBLISHED_PORTS;
      do 
        export COMMAND+=" --publish published=PORT,target=PORT,protocol=tcp,mode=ingress"
      done
    - export COMMAND+=" haproxytech/haproxy-debian:2.2"
  tags:
    - docker
