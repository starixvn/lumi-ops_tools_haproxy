.sync-config:
  stage: sync
  script:
    - >
      for NODE in $SWARM_NODES;
      do 
        ssh -o StrictHostKeyChecking=no $SERVER_USER@$NODE "mkdir -p $WORKING_PATH";
        scp $CONFIGS_SRC_DIR_PATH/$CONFIG_FILE-${CI_ENVIRONMENT_NAME} $SERVER_USER@$NODE:$WORKING_PATH;
      done
  tags:
    - docker

.sync-config-kbt:
  stage: sync
  script:
    - >
      for NODE in $SWARM_NODES;
      do
        ssh -p $KBT_PROXY_SSH_PORT -t $KBT_PROXY_USER@$KBT_PROXY_ADDRESS
        ssh -p $SERVER_PORT -o StrictHostKeyChecking=no $SERVER_USER@$NODE "mkdir -p $WORKING_PATH";
        scp 
        -P $SERVER_PORT 
        -o ProxyCommand="ssh -p $KBT_PROXY_SSH_PORT -W %h:%p $KBT_PROXY_USER@$KBT_PROXY_ADDRESS" $CONFIGS_SRC_DIR_PATH/$CONFIG_FILE-${CI_ENVIRONMENT_NAME} $SERVER_USER@$NODE:$WORKING_PATH;
      done
  tags:
    - docker
