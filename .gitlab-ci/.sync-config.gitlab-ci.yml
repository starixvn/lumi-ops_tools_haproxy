.sync-config:
  stage: sync
  script:
    - >
      for NODE in $SWARM_NODES;
      do 
        ssh $SERVER_USER@$NODE "mkdir -p $WORKING_PATH";
        scp $CONFIGS_SRC_DIR_PATH/$CI_ENVIRONMENT_NAME/$CONFIG_FILE $SERVER_USER@$NODE:$WORKING_PATH;
      done
  tags:
    - docker

.sync-config-kbt:
  stage: sync
  script:
    - >
      for NODE in $SWARM_NODES;
      do
        if [ $NODE == 10.2.189.65 ]; 
        then
          export NODE_PORT=$KBT_PROXY_SSH_PORT;
        else
          export NODE_PORT=22;
        fi
        ssh -p $KBT_PROXY_SSH_PORT -t $KBT_PROXY_USER@$KBT_PROXY_ADDRESS ssh -p $NODE_PORT $SERVER_USER@$NODE "mkdir -p $WORKING_PATH";
        scp -P $NODE_PORT -o ProxyCommand="ssh -p $KBT_PROXY_SSH_PORT -W %h:%p $KBT_PROXY_USER@$KBT_PROXY_ADDRESS" $CONFIGS_SRC_DIR_PATH/$CI_ENVIRONMENT_NAME/$CONFIG_FILE $SERVER_USER@$NODE:$WORKING_PATH;
        scp -P $NODE_PORT -o ProxyCommand="ssh -p $KBT_PROXY_SSH_PORT -W %h:%p $KBT_PROXY_USER@$KBT_PROXY_ADDRESS" $CONFIGS_SRC_DIR_PATH/whitelisted.ips $SERVER_USER@$NODE:$WORKING_PATH;
        echo "Sync done for $NODE:$NODE_PORT";
      done
  tags:
    - docker
