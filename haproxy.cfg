global
    maxconn 50000
    log fd@2 local2
    chroot       /var/lib/haproxy
    pidfile      /var/run/haproxy.pid
    user         haproxy
    group        haproxy
    stats socket /var/lib/haproxy/stats expose-fd listeners
    master-worker

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    hold valid      10s
    hold obsolete   10s

defaults
    mode http
    log global
    option httplog
    option  http-server-close
    option  dontlognull
    option  redispatch
    option  contstats
    retries 5
    backlog 10000
    maxconn 50000
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    timeout tunnel        3600s
    timeout http-keep-alive  1s
    timeout http-request    15s
    timeout queue           30s
    timeout tarpit          60s
    default-server inter 3s rise 2 fall 3

frontend stats
    bind *:9999
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    
frontend games_gateway
    bind *:6969
    mode  http
    use_backend sedie_nodes if { path_beg /sedie/ }
    # use_backend vipsedie_nodes if { path_beg /vipsedie/ }

    default_backend sedie_nodes

backend sedie_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /sedie(.*) /socket.io\1
    server-template sedie_service 1 l1-sedie-service-LOCAL:8082 check resolvers docker init-addr libc,none
    # server sedie_service1 10.10.50.14:8082 cookie check

