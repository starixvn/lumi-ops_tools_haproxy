global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option  http-server-close
    option  dontlognull
    option  redispatch
    option  contstats
    retries 3
    backlog 10000
    timeout client          25s
    timeout connect          5s
    timeout server          25s
    timeout tunnel        3600s
    timeout http-keep-alive  1s
    timeout http-request    15s
    timeout queue           30s
    timeout tarpit          60s
    default-server inter 3s rise 2 fall 3

frontend games_gateway
    bind *:6969
    mode  http
    acl is_sedie path -i -m beg /sedie/
    use_backend sedie_nodes if is_sedie

    default_backend sedie_nodes

backend sedie_nodes
    mode  http
    # option forwardfor
    # option http-server-close
    # option httpchk HEAD /health
    # http-check expect status 200
    # cookie serverid insert
    server sedie_service1 10.10.50.14:8082 check

backend vipsedie_nodes
    # option forwardfor
    # option http-server-close
    # option httpchk HEAD /health
    # http-check expect status 200
    # cookie serverid insert
    server vipsedie 10.10.50.14:8083 check


