global
        log /dev/log    local0
        log /dev/log    local1 notice
        chroot /var/lib/haproxy

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http


frontend games_gateway
    bind *:6969
    mode  http
    acl PATH_sedie path_beg -i /sedie
    acl PATH_vipsedie path_beg -i /vipsedie

    use_backend sedie_nodes if PATH_sedie
    use_backend vipsedie_nodes if PATH_vipsedie

backend sedie_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server sedie 10.10.50.14:8082 cookie check

backend vipsedie_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server vipsedie 10.10.50.14:8083 cookie check


