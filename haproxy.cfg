global
    log /dev/log    local0
    log /dev/log    local1 notice

defaults
    mode http
    log global
    option httplog
    option  http-server-close
    option  dontlognull
    option  redispatch
    option  contstats
    retries 3
    backlog 10000
    timeout client          25s
    timeout connect          5s
    timeout server          25s
    timeout tunnel        3600s
    timeout http-keep-alive  1s
    timeout http-request    15s
    timeout queue           30s
    timeout tarpit          60s
    default-server inter 3s rise 2 fall 3
    option forwardfor

frontend games_gateway
    bind *:6969
    mode  http
    acl PATH_sedie path_beg -i /sedie
    acl PATH_vipsedie path_beg -i /vipsedie

    use_backend sedie_nodes if PATH_sedie
    use_backend vipsedie_nodes if PATH_vipsedie

backend sedie_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server sedie 10.10.50.14:8082 cookie check

backend vipsedie_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server vipsedie 10.10.50.14:8083 cookie check


