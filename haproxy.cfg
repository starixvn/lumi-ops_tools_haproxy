global
    maxconn 50000
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option  http-server-close
    option  dontlognull
    option  redispatch
    option  contstats
    retries 3
    backlog 10000
    timeout client          25s
    timeout connect          5s
    timeout server          25s
    timeout tunnel        3600s
    timeout http-keep-alive  1s
    timeout http-request    15s
    timeout queue           30s
    timeout tarpit          60s
    default-server inter 3s rise 2 fall 3

frontend stats
    bind *:8080
    stats enable
    stats uri /stats
    stats refresh 10s
    
frontend games_gateway
    bind *:6969
    mode  http
    use_backend sedie_nodes if { path_beg /sedie/ }
    use_backend vipsedie_nodes if { path_beg /vipsedie/ }

    default_backend sedie_nodes

backend sedie_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /sedie(.*) /socket.io\1
    server sedie_service1 10.10.50.14:8082 cookie check

backend vipsedie_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /vipsedie(.*) /socket.io\1
    server vipsedie 10.10.50.14:8083 cookie check


