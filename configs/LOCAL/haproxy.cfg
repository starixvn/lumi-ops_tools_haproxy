global
    maxconn 50000
    log fd@2 local2
    chroot       /var/lib/haproxy
    pidfile      /var/run/haproxy.pid
    user         haproxy
    group        haproxy
    stats socket /var/lib/haproxy/stats expose-fd listeners
    master-worker

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    hold valid      10s
    hold obsolete   10s

defaults
    mode http
    log global
    option httplog
    option  http-server-close
    option  dontlognull
    option  redispatch
    option  contstats
    retries 5
    backlog 10000
    maxconn 50000
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    timeout tunnel        3600s
    timeout http-keep-alive  1s
    timeout http-request    15s
    timeout queue           30s
    timeout tarpit          60s
    default-server inter 3s rise 2 fall 3

frontend http_in
    bind *:80
    mode  http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    acl l1_game_client_host hdr(host) -i games.lumigame.com
    use_backend l1_game_client_nodes if l1_game_client_host

    acl l1_api_host hdr(host) -i api.lumigame.com
    use_backend l1_api_nodes if l1_api_host

    acl l1_auth_api_host hdr(host) -i auth.lumigame.com
    use_backend l1_auth_api_nodes if l1_auth_api_host

    acl l1_game_admin_site_host hdr(host) -i admin.lumigame.com
    use_backend l1_game_admin_site_nodes if l1_game_admin_site_host

    acl l1_game_admin_api_host hdr(host) -i admin-api.lumigame.com
    use_backend l1_game_admin_api_nodes if l1_game_admin_api_host

    acl l1_gamelobby_simulator_host hdr(host) -i gamelobby-simulator.lumigame.com
    use_backend l1_gamelobby_simulator_nodes if l1_gamelobby_simulator_host

    acl l1_owapi_simulator_host hdr(host) -i owapi-simulator.lumigame.com
    use_backend l1_owapi_simulator_nodes if l1_owapi_simulator_host



frontend l1_games_proxy
    bind *:7000
    mode  http
    option forwardfor
    use_backend l1_game_server_nodes if { path_beg /main/ }
    use_backend l1_sedie_nodes if { path_beg /sedie/ }
    use_backend l1_vip_sedie_nodes if { path_beg /vipsedie/ }
    use_backend l1_special_sedie_nodes if { path_beg /specialsedie/ }
    use_backend l1_owapi_simulator_nodes if { path_beg /owapi/ }
    default_backend l1_game_server_nodes

backend l1_game_server_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /main/(.*) /\1
    server-template l1_game_server 1 l1-game-server-LOCAL:8001 check resolvers docker init-addr libc,none

backend l1_sedie_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /sedie(.*) /socket.io\1
    server-template l1_sedie_service 1 l1-sedie-service-LOCAL:8002 check resolvers docker init-addr libc,none
    # server sedie_service1 10.10.50.14:8082 check

backend l1_vip_sedie_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /vipsedie(.*) /socket.io\1
    # server vip_sedie_service1 10.10.50.14:8083 check
    server-template l1_vip_sedie_service 1 l1-vip-sedie-service-LOCAL:8003 check resolvers docker init-addr libc,none

backend l1_special_sedie_nodes
