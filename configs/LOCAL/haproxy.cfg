backend l1_game_client_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server l1_game_client 10.10.50.14:8000 check
    server-template l1_game_client 1 l1-game-client-LOCAL:8000 check resolvers docker init-addr libc,none

backend l1_api_nodes
