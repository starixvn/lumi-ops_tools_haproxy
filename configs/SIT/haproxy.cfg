global
    maxconn 50000
    log fd@2 local2
    chroot       /var/lib/haproxy
    pidfile      /var/run/haproxy.pid
    user         haproxy
    group        haproxy
    stats socket /var/lib/haproxy/stats expose-fd listeners
    master-worker

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    hold valid      10s
    hold obsolete   10s

defaults
    mode http
    log global
    option httplog
    option  http-server-close
    option  dontlognull
    option  redispatch
    option  contstats
    retries 5
    backlog 10000
    maxconn 50000
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    timeout tunnel        3600s
    timeout http-keep-alive  1s
    timeout http-request    15s
    timeout queue           30s
    timeout tarpit          60s
    default-server inter 3s rise 2 fall 3

frontend games_proxy
    bind *:7777
    mode  http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    use_backend l1_game_server_nodes_sit if { path_beg /sit/main/ }
    use_backend l1_sedie_nodes_sit if { path_beg /sit/sedie/ }
    use_backend l1_vip_sedie_nodes_sit if { path_beg /sit/vipsedie/ }
    use_backend l1_special_sedie_nodes_sit if { path_beg /sit/specialsedie/ }
    default_backend l1_game_server_nodes_sit

backend l1_game_server_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /sit/main/(.*) /\1
    server-template l1_game_server_sit 1 l1-game-server-SIT:6200 check resolvers docker init-addr libc,none

backend l1_sedie_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /sitsedie(.*) /socket.io\1
    # server l1_sedie_service 10.2.189.65:6000 check
    server-template l1_sedie_service_sit 1 l1-sedie-service-SIT:6000 check resolvers docker init-addr libc,none

backend l1_vip_sedie_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /sitvipsedie(.*) /socket.io\1
    server-template l1_vip_sedie_service_sit 1 l1-vip-sedie-service-SIT:6001 check resolvers docker init-addr libc,none

backend l1_special_sedie_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /sitspecialsedie(.*) /socket.io\1
    server-template l1_special_sedie_sit 1 l1-special-sedie-service-SIT:6002 check resolvers docker init-addr libc,none

frontend l1_game_client_sit
    bind *:6100
    mode  http
    option forwardfor
    default_backend l1_game_client_nodes_sit

backend l1_game_client_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_client_sit 2 l1-game-client-SIT:80 check resolvers docker init-addr libc,none

